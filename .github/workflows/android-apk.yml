name: Compilar APK MONDI AI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Instalar Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK de prueba
        run: gradle --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MONDI-AI-2.7-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK para descarga directa
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-debug-\${{ github.run_number }}
          name: MONDI AI 2.7 - APK de prueba
          body: APK de depuración de MONDI AI. Descarga app-debug.apk e instálala en Android 8.0 o posterior.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
